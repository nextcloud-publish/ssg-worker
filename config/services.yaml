# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html
parameters:
    # Defaults for the storage roots: their fixed locations inside the container. Set them for a deployment outside Docker.
    env(JOB_STORAGE_DIR): '/opt/ssg/build_temp'
    env(PUBLISHED_DIR): '/opt/ssg/published'
    # Defaults for the status callback options, used when the env var is not set.
    env(CALLBACK_TIMEOUT_SECONDS): '5'
    env(CALLBACK_MAX_DURATION_SECONDS): '10'
    env(CALLBACK_MAX_REDIRECTS): '0'
    # Defaults for the content download options, used when the env var is not set.
    env(DOWNLOAD_MAX_DURATION_SECONDS): '300'
    env(DOWNLOAD_TIMEOUT_SECONDS): '30'
    env(DOWNLOAD_MAX_REDIRECTS): '3'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Registered here rather than via #[AsMessageHandler] to pin it to the "builds" transport.
    App\Message\BuildJobHandler:
        tags:
            - { name: messenger.message_handler, handles: App\Message\BuildJob, from_transport: builds }

    # PUBLISH_BASE_URL has no default: it is the public URL of the deployment.
    App\Job\JobWorkspace:
        arguments:
            $buildTempDir: '%env(JOB_STORAGE_DIR)%'
            $publishedDir: '%env(PUBLISHED_DIR)%'
            $publishBaseUrl: '%env(PUBLISH_BASE_URL)%'

    # Needs the two roots to redact them from failure messages.
    App\Message\BuildFailureHandler:
        arguments:
            $buildTempDir: '%env(JOB_STORAGE_DIR)%'
            $publishedDir: '%env(PUBLISHED_DIR)%'

    # The PUT runs while the message is unacked, so keep these well below consumer_timeout.
    App\Job\StatusNotifier:
        arguments:
            $httpClient: '@app.http_client.no_private_network'
            $timeoutSeconds: '%env(int:CALLBACK_TIMEOUT_SECONDS)%'
            $maxDurationSeconds: '%env(int:CALLBACK_MAX_DURATION_SECONDS)%'
            $maxRedirects: '%env(int:CALLBACK_MAX_REDIRECTS)%'

    # Refuses requests to private addresses, also after redirects and DNS resolution.
    app.http_client.no_private_network:
        class: Symfony\Component\HttpClient\NoPrivateNetworkHttpClient
        arguments: ['@http_client']

    App\Job\ContentDownloader:
        arguments:
            # No default: the cap keeps one job from filling the shared build volume.
            $maxMegabytes: '%env(int:MAX_DOWNLOAD_MB)%'
            $maxDurationSeconds: '%env(int:DOWNLOAD_MAX_DURATION_SECONDS)%'
            $timeoutSeconds: '%env(int:DOWNLOAD_TIMEOUT_SECONDS)%'
            $maxRedirects: '%env(int:DOWNLOAD_MAX_REDIRECTS)%'

when@dev:
    services:
        # The dev callback endpoint (collectives-mock) has a private Docker address.
        app.http_client.no_private_network:
            alias: http_client

when@test:
    services:
        # Lets MessengerConfigTest read the retry strategy the container built.
        test.retry_strategy.builds:
            alias: messenger.retry.multiplier_retry_strategy.builds
            public: true

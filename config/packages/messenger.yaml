# see https://symfony.com/doc/current/messenger.html
framework:
    messenger:
        transports:
            builds:
                # Same env var and serializer as the publish API's transport.
                dsn: '%env(AMQP_DSN)%'
                serializer: messenger.transport.symfony_serializer

                options:
                    # The broker imports its topology from publish/docker/rabbitmq-config/definitions.json,
                    # including the `delays` exchange the retry delay queues bind to.
                    auto_setup: false

                    # Must match `heartbeat` in publish/docker/rabbitmq-config/rabbitmq.conf.
                    heartbeat: '%env(int:AMQP_HEARTBEAT)%'

                    queues:
                        q.builds:
                            # Without it, `messenger:stats` declares q.builds as a classic queue and fails against the quorum queue.
                            arguments:
                                x-queue-type: quorum

                    # The default exchange, which routes by queue name.
                    exchange:
                        name: ''
                        default_publish_routing_key: q.builds

                retry_strategy:
                    # Two build attempts in total. A redelivery after consumer_timeout also counts as one.
                    max_retries: 1
                    delay: 15000
                    multiplier: 4
                    max_delay: 60000
                    # The delay is part of the delay queue name, so jitter would declare a new queue per attempt.
                    jitter: 0

                # No failure_transport: on the last attempt BuildFailureHandler reports `failed` and the message is acked.

when@test:
    framework:
        messenger:
            transports:
                # No broker in tests. Merged over the block above, so `options` must still resolve.
                builds: 'in-memory://'

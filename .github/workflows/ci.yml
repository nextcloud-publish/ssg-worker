name: CI

on:
  pull_request:
  push:
    branches: [main]
    # A release is a tag like 1.2.3, without a leading v.
    tags: ['[0-9]+.[0-9]+.[0-9]+']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PHP_VERSION: '8.5'
  MAX_DOWNLOAD_MB: "256"
  JOB_STORAGE_DIR: /tmp/ssg-ci/build_temp
  PUBLISHED_DIR: /tmp/ssg-ci/published
  PUBLISH_BASE_URL: http://sites.test
  PHP_EXTENSIONS: ctype, iconv, amqp, mbstring, json, phar, zlib

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      # Reads composer.lock, so it needs no install; fails on any known advisory.
      - name: Audit dependencies
        run: composer audit --locked

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Check PHP syntax
        run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Lint YAML config
        run: php bin/console lint:yaml config

      - name: Lint service container
        run: php bin/console lint:container

      - name: PHPStan
        run: php bin/console cache:warmup --env=dev && vendor/bin/phpstan analyse --no-progress

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: PHPUnit
        run: vendor/bin/phpunit

  image:
    name: Build and push image
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main on a push to main, the branch name for a pull request, 1.2.3, 1.2, 1 and latest
      # for a release (no 0 during 0.x), and sha-<commit> on every image.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        env:
          # The PR's last commit, not the merge commit GitHub builds from.
          DOCKER_METADATA_PR_HEAD_SHA: true
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/0.') }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
